<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Your first Skaro workflow</title>
  <desc id="desc">Connect a project, discuss and accept a plan, run a task, inspect its result, and merge it. Check the automatic merge setting before starting.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a6a6a6" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="380" rx="20" fill="#171717"/>
  <g font-family="Arial, sans-serif" fill="#f3f3f3">
    <text x="42" y="54" font-size="28" font-weight="700">From a project folder to a completed task</text>
    <text x="42" y="88" font-size="17" fill="#b5b5b5">Your agent changes code. Skaro organizes the work and its results.</text>
    <g fill="#242424" stroke="#404040"><rect x="42" y="133" width="190" height="138" rx="12"/><rect x="274" y="133" width="190" height="138" rx="12"/><rect x="506" y="133" width="190" height="138" rx="12"/><rect x="738" y="133" width="190" height="138" rx="12"/><rect x="970" y="133" width="188" height="138" rx="12"/></g>
    <g font-size="22" font-weight="700"><text x="62" y="177">1. Connect</text><text x="294" y="177">2. Plan</text><text x="526" y="177">3. Run</text><text x="758" y="177">4. Inspect</text><text x="990" y="177">5. Merge</text></g>
    <g font-size="16" fill="#b5b5b5"><text x="62" y="214">Open a code folder</text><text x="62" y="239">or create a project</text><text x="294" y="214">Discuss the goal</text><text x="294" y="239">and accept tasks</text><text x="526" y="214">Choose agent, model</text><text x="526" y="239">and permissions</text><text x="758" y="214">Read the result</text><text x="758" y="239">and check changes</text><text x="990" y="214">Confirm manually</text><text x="990" y="239">or use auto-merge</text></g>
    <g stroke="#a6a6a6" stroke-width="2" marker-end="url(#arrow)"><path d="M240 202H263"/><path d="M472 202H495"/><path d="M704 202H727"/><path d="M936 202H959"/></g>
    <text x="42" y="316" font-size="17">Want to review before merging? Check the automatic merge setting before running the task.</text>
    <text x="42" y="346" font-size="16" fill="#b5b5b5">Current folder edits happen directly in the main working folder; they have no separate task branch to merge.</text>
  </g>
</svg>
