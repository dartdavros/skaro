<!doctype html>
<html lang="ru">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TARDIS — просмотр анимации</title>
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      height: 100%;
    }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      pointer-events: none;
    }
    footer {
      padding: 12px;
      text-align: center;
    }
  </style>
  <canvas
    id="flight"
    role="img"
    aria-label="TARDIS вращается и летит по эллипсу на прозрачном фоне"
  ></canvas>
  <footer>
    <button id="play" type="button" disabled>Запустить полёт</button
    ><output id="error" role="alert"></output>
  </footer>
  <script id="model" type="application/octet-stream">
    __MODEL_BASE64__
  </script>
  <audio id="flight-audio" preload="auto" src="data:audio/mpeg;base64,__AUDIO_BASE64__"></audio>
  <script>
    __FLIGHT_BUNDLE__;
  </script>
  <script>
    (async () => {
      const button = document.getElementById('play');
      const canvas = document.getElementById('flight');
      try {
        const bytes = Uint8Array.from(
          atob(document.getElementById('model').textContent.trim()),
          (c) => c.charCodeAt(0),
        );
        const flight = await TardisFlight.createTardisFlight({
          canvas,
          modelData: bytes.buffer,
          audio: document.getElementById('flight-audio'),
          onAudioError: (error) => {
            document.getElementById('error').textContent = error.message;
            console.error(error);
          },
        });
        button.disabled = false;
        button.addEventListener('click', () => flight.play());
        window.addEventListener('pagehide', () => flight.dispose(), { once: true });
      } catch (error) {
        document.getElementById('error').textContent = error.message;
        console.error(error);
      }
    })();
  </script>
</html>
