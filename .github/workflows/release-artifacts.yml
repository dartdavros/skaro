name: Build and publish release
on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Stable installer bundle version (always increases)
        required: true
        type: string
      skaro_version:
        description: Displayed Skaro version (unchanged for agent-only releases)
        required: true
        type: string
      agents_verified:
        description: Pinned agents passed real canary scenarios and model probes
        required: true
        type: boolean
      test_fixtures_allowed:
        description: Explicit permission for existing isolated test fixtures and HTTP test servers
        required: true
        default: false
        type: boolean
      check_scope:
        description: Verification scope explicitly selected by the owner
        required: true
        default: full
        type: choice
        options:
          - full
          - diagram-export
      publish_release:
        description: Publish the complete unsigned bundle to GitHub Releases
        required: true
        default: false
        type: boolean
concurrency:
  group: release-${{ inputs.bundle_version }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  SKARO_BUNDLE_VERSION: ${{ inputs.bundle_version }}
  SKARO_PRODUCT_VERSION: ${{ inputs.skaro_version }}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require agent verification and permission for release tests
        env:
          AGENTS_VERIFIED: ${{ inputs.agents_verified }}
          TEST_FIXTURES_ALLOWED: ${{ inputs.test_fixtures_allowed }}
          CHECK_SCOPE: ${{ inputs.check_scope }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [ "$AGENTS_VERIFIED" != 'true' ]; then
            echo 'Accepted verification of the pinned agents is required.' >&2
            exit 1
          fi
          if [ "$CHECK_SCOPE" != 'full' ] && [ "$CHECK_SCOPE" != 'diagram-export' ]; then
            echo 'Unknown verification scope.' >&2
            exit 1
          fi
          if [ "$CHECK_SCOPE" = 'full' ] && [ "$TEST_FIXTURES_ALLOWED" != 'true' ]; then
            echo 'Full tests require explicit permission for fixtures and HTTP test servers.' >&2
            exit 1
          fi
          if [ "$PUBLISH_RELEASE" = 'true' ] && [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Published releases must be built from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@skaro/agent-probe'
      - name: Install pinned Electron runtime before parallel tests
        run: pnpm --filter @skaro/desktop exec node -e "require('electron')"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r --parallel --filter '!@skaro/agent-probe' typecheck
      - name: Build real background workers for storage integration tests
        if: inputs.check_scope == 'full'
        run: pnpm build
      - name: Full release tests
        if: inputs.check_scope == 'full'
        run: pnpm test --maxWorkers=2 --testTimeout=30000 --hookTimeout=60000
      - name: Diagram export tests only (no fixtures or HTTP servers)
        if: inputs.check_scope == 'diagram-export'
        run: pnpm exec vitest run --project @skaro/desktop apps/desktop/src/main/graph/export-live.test.ts apps/desktop/src/renderer/src/diagram-export/image.test.ts
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SKARO_RELEASE_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@skaro/agent-probe'
      - name: Build application
        run: pnpm build
      - name: Create installers without publisher signatures (never publish)
        shell: pwsh
        run: |
          $arguments = @('exec', 'electron-builder', '--publish', 'never', "--$env:SKARO_RELEASE_ARCH", "--config.extraMetadata.version=$env:SKARO_BUNDLE_VERSION")
          pnpm @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: apps/desktop
      - run: pnpm --filter @skaro/desktop release:manifest platform
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.runner }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-x64.yml
            apps/desktop/release/latest-arm64.yml
            apps/desktop/release/latest-x64-mac.yml
            apps/desktop/release/latest-arm64-mac.yml
            apps/desktop/release/latest-linux*.yml
            apps/desktop/release/skaro-release-*.json
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@skaro/agent-probe'
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: apps/desktop/release
      - run: pnpm --filter @skaro/desktop release:manifest merge
      - uses: actions/upload-artifact@v4
        with:
          name: skaro-update-bundle-${{ inputs.bundle_version }}
          path: apps/desktop/release/
      - name: Publish complete release through a draft
        if: inputs.publish_release && github.repository == 'dartdavros/skaro'
        env:
          GH_TOKEN: ${{ github.token }}
          SKARO_PUBLISH_RELEASE: 'true'
        run: node apps/desktop/scripts/publish-release.mjs
